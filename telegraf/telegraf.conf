[agent]
  interval = "2s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "2s"

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["friocerto/abc/+/telemetria/temperatura"]
  qos = 0
  data_format = "json"
  name_override = "temperatura_camara"
  tag_keys = ["loja", "regiao"]

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "dev-token-please-change"
  organization = "friocerto"
  bucket = "sensores"
